<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Mottagare – Videoströmming & Datasparare</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-mottagare: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f9fa;
                --card-bg: #ffffff;
                --text-color: #212529;
                --text-secondary: #6c757d;
                --border-color: rgba(0, 0, 0, 0.1);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; }
        .back-link { color: var(--accent-mottagare); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video, img { width: 100%; height: 100%; object-fit: cover; }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:active { opacity: 0.8; }
        .btn-success { background-color: var(--accent-mottagare); color: #fff; border: none; }
        .btn-warning { background-color: var(--warning-color); color: #000; border: none; }
        .full-width { grid-column: span 2; }

        .debug-console {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-error { color: #ff4444; }
        .log-warn { color: #ffbb33; }
        .log-status { color: #77ff77; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Startsida</a>
            <span id="status" class="status-badge">Söker sändare...</span>
        </header>

        <div class="video-container">
            <video id="remote-video" autoplay playsinline controls></video>
            <img id="remote-snapshot" style="display:none;" alt="Övervakningsbild" />
        </div>

        <div class="controls-grid">
            <button id="btn-reconnect" class="btn-success full-width">Ange PIN & Anslut</button>
            <button id="btn-toggle-stream" class="btn-warning">⏸ Pausa Ström</button>
            <button id="btn-audio-only">🔈 Endast ljud: AV</button>
            <button id="btn-fullscreen" class="full-width">Helskärm</button>
        </div>

        <div class="debug-console">
            <ul id="debug-log" style="list-style: none;"></ul>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'standard-rum';
        const targetPeerId = `stream-host-${roomId}`;

        const debugLog = document.getElementById('debug-log');
        const statusBadge = document.getElementById('status');
        const videoElement = document.getElementById('remote-video');
        const snapshotElement = document.getElementById('remote-snapshot');
        
        let peer = null;
        let currentCall = null;
        let dataConn = null;
        let lastUsedPin = '';
        let isAudioOnly = false;
        let isStreamPaused = false;

        function log(msg, type = 'info') {
            const li = document.createElement('li');
            li.textContent = `[${new Date().toLocaleTimeString('sv-SE')}] ${msg}`;
            if (type === 'error') li.className = 'log-error';
            if (type === 'warn') li.className = 'log-warn';
            if (type === 'status') li.className = 'log-status';
            debugLog.appendChild(li);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function connectToHost() {
            if (!peer || peer.disconnected) {
                log('Kopplar upp mot PeerJS på nytt...', 'warn');
                initPeer();
                setTimeout(connectToHost, 1000);
                return;
            }

            const userPin = prompt("Ange det 5-siffriga lösenordet för strömmen:", lastUsedPin);
            if (!userPin) {
                log('Inget lösenord angavs. Anslutning avbruten.', 'warn');
                statusBadge.textContent = 'Kräver kod';
                statusBadge.style.color = 'var(--danger-color)';
                return;
            }

            lastUsedPin = userPin.trim();
            log(`Verifierar kod med sändaren (${targetPeerId})...`);
            statusBadge.textContent = 'Verifierar...';
            statusBadge.style.color = 'var(--warning-color)';

            if (dataConn) dataConn.close();
            dataConn = peer.connect(targetPeerId);

            dataConn.on('open', () => {
                dataConn.send({ type: 'auth', pin: lastUsedPin });
            });

            dataConn.on('data', (data) => {
                if (data && data.type === 'auth-result') {
                    if (data.success) {
                        log('Lösenord godkänt! Ansluter till video och ljud...', 'status');
                        startVideoCall();
                    } else {
                        log('Felaktigt lösenord! Åtkomst nekad.', 'error');
                        statusBadge.textContent = 'Fel kod';
                        statusBadge.style.color = 'var(--danger-color)';
                        alert('Felaktigt lösenord. Försök igen.');
                    }
                }

                if (data && data.type === 'snapshot-frame') {
                    videoElement.style.display = 'none';
                    snapshotElement.style.display = 'block';
                    snapshotElement.src = data.image;
                    statusBadge.textContent = 'Snapshot-läge (Sparar data)';
                    statusBadge.style.color = 'var(--accent-mottagare)';
                }
            });

            dataConn.on('error', (err) => {
                log(`Anslutningsfel vid verifiering: ${err.message}`, 'error');
                statusBadge.textContent = 'Anslutningsfel';
                statusBadge.style.color = 'var(--danger-color)';
            });
        }

        function startVideoCall() {
            if (currentCall) currentCall.close();

            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 1;
            const dummyStream = canvas.captureStream();

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioCtx.createMediaStreamDestination();
                dummyStream.addTrack(dest.stream.getAudioTracks()[0]);
            } catch (err) {
                log('Kunde inte skapa tomt ljudspår.', 'warn');
            }

            currentCall = peer.call(targetPeerId, dummyStream);

            if (!currentCall) {
                log('Kunde inte initiera anrop.', 'error');
                return;
            }

            currentCall.on('stream', (remoteStream) => {
                log('Ström (bild & ljud) mottagen!', 'status');
                statusBadge.textContent = 'Ansluten';
                statusBadge.style.color = 'var(--accent-mottagare)';
                
                snapshotElement.style.display = 'none';
                videoElement.style.display = 'block';
                videoElement.srcObject = remoteStream;

                videoElement.play().catch(() => {
                    log('Tryck på spelaren för att starta ljudet.', 'warn');
                });

                applyAudioOnlyState();
            });

            currentCall.on('close', () => {
                log('Strömmen avslutades av sändaren.', 'warn');
                statusBadge.textContent = 'Frånkopplad';
                statusBadge.style.color = 'var(--danger-color)';
            });
        }

        function applyAudioOnlyState() {
            if (!videoElement.srcObject) return;
            const videoTracks = videoElement.srcObject.getVideoTracks();
            videoTracks.forEach(track => track.enabled = !isAudioOnly);
            
            const btn = document.getElementById('btn-audio-only');
            if (isAudioOnly) {
                btn.textContent = '🔈 Endast ljud: PÅ';
                btn.className = 'btn-warning';
                log('Stängde av video. Streamar endast ljud (Sparar data).');
            } else {
                btn.textContent = '🔈 Endast ljud: AV';
                btn.className = '';
                log('Släppte på videoströmmen igen.');
            }
        }

        document.getElementById('btn-audio-only').addEventListener('click', () => {
            isAudioOnly = !isAudioOnly;
            applyAudioOnlyState();
        });

        function togglePauseStream() {
            const btn = document.getElementById('btn-toggle-stream');
            if (isStreamPaused) {
                if (lastUsedPin) startVideoCall();
                else connectToHost();
                btn.textContent = '⏸ Pausa Ström';
                btn.className = 'btn-warning';
                isStreamPaused = false;
                log('Återupptog strömmen.');
            } else {
                if (currentCall) currentCall.close();
                videoElement.srcObject = null;
                btn.textContent = '▶ Starta Ström';
                btn.className = 'btn-success';
                statusBadge.textContent = 'Pausad (Sparar data)';
                statusBadge.style.color = 'var(--warning-color)';
                isStreamPaused = true;
                log('Pausade strömmen för att spara mobildata.');
            }
        }
        document.getElementById('btn-toggle-stream').addEventListener('click', togglePauseStream);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && currentCall && !isStreamPaused) {
                log('Skärm släckt / Flik dold: Pausar videoströmmen för att spara data.', 'warn');
                togglePauseStream();
            }
        });

        function initPeer() {
            log('Initierar PeerJS för mottagaren...');
            
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                log(`Mottagarklient redo (ID: ${id}).`, 'status');
                statusBadge.textContent = 'Väntar på anslutning';
                statusBadge.style.color = 'var(--warning-color)';
            });

            peer.on('error', (err) => {
                log(`PeerJS Fel: ${err.type} - ${err.message}`, 'error');
                if (err.type === 'peer-not-found') {
                    statusBadge.textContent = 'Sändare saknas';
                    statusBadge.style.color = 'var(--danger-color)';
                    log('Hittade ingen sändare. Kontrollera att sändarsidan är öppen och att rum-ID i URL är rätt.', 'warn');
                } else {
                    statusBadge.textContent = 'Nätverksfel';
                    statusBadge.style.color = 'var(--danger-color)';
                }
            });
        }

        document.getElementById('btn-reconnect').addEventListener('click', connectToHost);
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (videoElement.requestFullscreen) videoElement.requestFullscreen();
            else if (videoElement.webkitRequestFullscreen) videoElement.webkitRequestFullscreen();
        });

        initPeer();
    </script>
</body>
  </html>
