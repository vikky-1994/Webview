<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Mottagare – Videoströmming</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-mottagare: #28a745;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f9fa;
                --card-bg: #ffffff;
                --text-color: #212529;
                --text-secondary: #6c757d;
                --border-color: rgba(0, 0, 0, 0.1);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; }
        .back-link { color: var(--accent-mottagare); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .pin-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        .pin-container label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .pin-container input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:active { opacity: 0.8; }
        .btn-success { background-color: var(--accent-mottagare); color: #fff; border: none; }

        .debug-console {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-error { color: #ff4444; }
        .log-warn { color: #ffbb33; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Startsida</a>
            <span id="status" class="status-badge">Söker sändare...</span>
        </header>

        <div class="video-container">
            <video id="remote-video" autoplay playsinline controls></video>
        </div>

        <!-- Nytt integrerat fält för PIN-kod -->
        <div class="pin-container">
            <label for="pin-input">Ange 5-siffrig PIN-kod från sändaren:</label>
            <input type="text" id="pin-input" maxlength="5" placeholder="-----" autocomplete="off">
        </div>

        <div class="controls-grid">
            <button id="btn-reconnect" class="btn-success">Anslut till ström</button>
            <button id="btn-fullscreen">Helskärm</button>
        </div>

        <div class="debug-console">
            <ul id="debug-log" style="list-style: none;"></ul>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'standard-rum';
        const targetPeerId = `stream-host-${roomId}`;

        const debugLog = document.getElementById('debug-log');
        const statusBadge = document.getElementById('status');
        const videoElement = document.getElementById('remote-video');
        const pinInput = document.getElementById('pin-input');
        
        let peer = null;
        let currentCall = null;

        function log(msg, type = 'info') {
            const li = document.createElement('li');
            li.textContent = `[${new Date().toLocaleTimeString('sv-SE')}] ${msg}`;
            if (type === 'error') li.className = 'log-error';
            if (type === 'warn') li.className = 'log-warn';
            debugLog.appendChild(li);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function connectToHost() {
            const userPin = pinInput.value.trim();
            if (!userPin || userPin.length !== 5) {
                log('Ange en giltig 5-siffrig PIN-kod.', 'warn');
                statusBadge.textContent = 'Ogiltig kod';
                statusBadge.style.color = '#dc3545';
                return;
            }

            log(`Verifierar kod med sändaren...`);
            statusBadge.textContent = 'Verifierar...';
            statusBadge.style.color = '#ffbb33';

            const conn = peer.connect(targetPeerId);

            conn.on('open', () => {
                conn.send({ type: 'auth', pin: userPin });
            });

            conn.on('data', (data) => {
                if (data && data.type === 'auth-result') {
                    if (data.success) {
                        log('Lösenord godkänt! Ansluter till video och ljud...');
                        startVideoCall();
                    } else {
                        log('Felaktigt lösenord! Åtkomst nekad.', 'error');
                        statusBadge.textContent = 'Fel kod';
                        statusBadge.style.color = '#dc3545';
                    }
                }
            });

            conn.on('error', (err) => {
                log(`Anslutningsfel vid verifiering: ${err.message}`, 'error');
            });
        }

        function startVideoCall() {
            if (currentCall) currentCall.close();

            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 1;
            const dummyStream = canvas.captureStream();

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const dest = audioCtx.createMediaStreamDestination();
                dummyStream.addTrack(dest.stream.getAudioTracks()[0]);
            } catch (err) {
                log('Kunde inte skapa tomt ljudspår. Ljud kan saknas.', 'warn');
            }

            currentCall = peer.call(targetPeerId, dummyStream);

            if (!currentCall) {
                log('Kunde inte initiera anrop.', 'error');
                return;
            }

            currentCall.on('stream', (remoteStream) => {
                log('Ström (bild & ljud) mottagen!');
                statusBadge.textContent = 'Ansluten';
                statusBadge.style.color = '#28a745';
                videoElement.srcObject = remoteStream;
            });

            currentCall.on('close', () => {
                log('Strömmen avslutades av sändaren.', 'warn');
                statusBadge.textContent = 'Frånkopplad';
                statusBadge.style.color = '#dc3545';
            });

            currentCall.on('error', (err) => {
                log(`Anropsfel: ${err.message}`, 'error');
            });
        }

        function initPeer() {
            peer = new Peer(); 

            peer.on('open', () => {
                log('Mottagarklient redo.');
                statusBadge.textContent = 'Väntar på PIN';
                statusBadge.style.color = '#ffbb33';
            });

            peer.on('error', (err) => {
                log(`PeerJS Fel: ${err.type}`, 'error');
                if (err.type === 'peer-not-found') {
                    log(`Sändare saknas för rummet. Kontrollera att sändaren är igång.`, 'warn');
                    statusBadge.textContent = 'Sändare saknas';
                    statusBadge.style.color = '#dc3545';
                }
            });
        }

        document.getElementById('btn-reconnect').addEventListener('click', connectToHost);

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (videoElement.requestFullscreen) {
                videoElement.requestFullscreen();
            } else if (videoElement.webkitRequestFullscreen) {
                videoElement.webkitRequestFullscreen();
            }
        });

        initPeer();
    </script>
</body>
</html>
