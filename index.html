<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="Navigeringsportal för videoströmsanslutning">
    <title>Startsida – Videoströmming</title>
    
    <!-- PWA & Favicon (Anpassa sökvägar vid behov) -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-user: #007bff;
            --accent-mottagare: #28a745;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.15s ease, background-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-card:active, .nav-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
        }

        .card-info {
            text-align: left;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .card-badge {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .badge-user { background-color: var(--accent-user); }
        .badge-mottagare { background-color: var(--accent-mottagare); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Välj läge</h1>
        <p class="subtitle">Anslut som sändare eller mottagare</p>

        <nav class="nav-grid">
            <a href="Anvandare.html" class="nav-card">
                <div class="card-info">
                    <span class="card-title">Användare (Sändare)</span>
                    <span class="card-desc">Strömma video från denna enhet</span>
                </div>
                <div class="card-badge badge-user"></div>
            </a>

            <a href="Mottagare.html" class="nav-card">
                <div class="card-info">
                    <span class="card-title">Mottagare</span>
                    <span class="card-desc">Titta på den inkommande videoströmmen</span>
                </div>
                <div class="card-badge badge-mottagare"></div>
            </a>
        </nav>
    </div>

</body>
</html>
