<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="Navigeringsportal för videoströmsanslutning">
    <title>Startsida – Videoströmming</title>
    
    <!-- PWA & Favicon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-user: #007bff;
            --accent-mottagare: #28a745;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
        }

        /* Automatiskt ljust läge om enheten ber om det */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f9fa;
                --card-bg: #ffffff;
                --card-hover: #f1f3f5;
                --text-color: #212529;
                --text-secondary: #6c757d;
                --border-color: rgba(0, 0, 0, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        #network-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .status-online { color: #28a745; }
        .status-offline { color: #dc3545; }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            transition: transform 0.15s ease, background-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-card:active, .nav-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
        }

        .card-info { text-align: left; }
        .card-title { font-size: 1.1rem; font-weight: 600; display: block; margin-bottom: 4px; }
        .card-desc { font-size: 0.85rem; color: var(--text-secondary); }
        .card-badge { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-left: 12px; }
        .badge-user { background-color: var(--accent-user); }
        .badge-mottagare { background-color: var(--accent-mottagare); }

        .debug-console {
            margin-top: 32px;
            background-color: #000000;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.75rem;
            text-align: left;
            padding: 12px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #333;
            display: flex;
            flex-direction: column-reverse; /* Nyaste loggarna längst ner */
        }
        
        .debug-console ul {
            list-style: none;
        }

        .log-error { color: #ff4444; }
        .log-warn { color: #ffbb33; }
    </style>
</head>
<body>

    <div class="container">
        <div id="network-status" class="status-online">● Online</div>

        <h1>Välj läge</h1>
        <p class="subtitle">Anslut som sändare eller mottagare</p>

        <!-- Rumshantering borttagen: appen använder alltid ett fast standardrum -->

        <nav class="nav-grid">
            <a href="Anvandare.html" id="link-user" class="nav-card">
                <div class="card-info">
                    <span class="card-title">Användare (Sändare) [1]</span>
                    <span class="card-desc">Strömma video från denna enhet</span>
                </div>
                <div class="card-badge badge-user"></div>
            </a>

            <a href="Mottagare.html" id="link-receiver" class="nav-card">
                <div class="card-info">
                    <span class="card-title">Mottagare [2]</span>
                    <span class="card-desc">Titta på inkommande videoström</span>
                </div>
                <div class="card-badge badge-mottagare"></div>
            </a>
        </nav>

        <!-- Debug-ruta -->
        <div class="debug-console">
            <ul id="debug-log"></ul>
        </div>
    </div>

    <script>
        // --- 1. System- och Debug-logik ---
        const debugLog = document.getElementById('debug-log');
        
        function logMsg(msg, type = 'info') {
            const li = document.createElement('li');
            const time = new Date().toLocaleTimeString('sv-SE');
            li.textContent = `[${time}] ${msg}`;
            
            if (type === 'error') li.className = 'log-error';
            if (type === 'warn') li.className = 'log-warn';
            
            debugLog.appendChild(li);
        }

        logMsg("System initierat. Kontrollerar stöd...");

        // --- 2. WebRTC & Säkerhetskontroll ---
        const hasWebRTC = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
        const isSecure = window.isSecureContext || window.location.hostname === 'localhost' || window.location.protocol === 'file:';

        if (!hasWebRTC) logMsg("Kamera-API saknas. Strömning kan misslyckas.", "error");
        if (!isSecure) logMsg("Körs inte över HTTPS. Kameraåtkomst kan blockeras.", "warn");

        // --- 3. Hantera Nätverksstatus ---
        const networkStatus = document.getElementById('network-status');
        
        function updateNetworkStatus() {
            if (navigator.onLine) {
                networkStatus.textContent = '● Online';
                networkStatus.className = 'status-online';
                logMsg("Nätverksanslutning återupprättad.");
            } else {
                networkStatus.textContent = '● Offline';
                networkStatus.className = 'status-offline';
                logMsg("Ingen nätverksanslutning. Kontrollera uppkopplingen.", "error");
            }
        }
        
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        const linkUser = document.getElementById('link-user');
        const linkReceiver = document.getElementById('link-receiver');

        // --- 4. Tangentbordsgenvägar ---
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                logMsg("Genväg [1] tryckt. Öppnar Sändare...");
                window.location.href = linkUser.href;
            } else if (e.key === '2') {
                logMsg("Genväg [2] tryckt. Öppnar Mottagare...");
                window.location.href = linkReceiver.href;
            }
        });

        // --- 5. Service Worker (PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => logMsg("Service Worker registrerad för offline-läge."))
                    .catch(err => logMsg(`PWA-registrering misslyckades: ${err.message}`, "warn"));
            });
        } else {
            logMsg("Service Workers stöds inte av denna webbläsare.", "warn");
        }
    </script>
</body>
</html>
