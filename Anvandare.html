<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Sändare – Videoströmming</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-user: #007bff;
            --danger-color: #dc3545;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f9fa;
                --card-bg: #ffffff;
                --text-color: #212529;
                --text-secondary: #6c757d;
                --border-color: rgba(0, 0, 0, 0.1);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; }
        .back-link { color: var(--accent-user); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background-color: var(--accent-user); color: #fff; border: none; }

        .debug-console {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-error { color: #ff4444; }
        .log-warn { color: #ffbb33; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Startsida</a>
            <span id="status" class="status-badge">Kopplar upp...</span>
        </header>

        <div class="video-container">
            <video id="local-video" autoplay playsinline muted></video>
        </div>

        <div class="controls-grid">
            <button id="btn-toggle-cam">Växla Kamera</button>
            <button id="btn-low-data" class="btn-primary">Spara Data: AV</button>
        </div>

        <div class="debug-console">
            <ul id="debug-log" style="list-style: none;"></ul>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'standard-rum';
        const peerId = `stream-host-${roomId}`;

        const debugLog = document.getElementById('debug-log');
        const statusBadge = document.getElementById('status');
        const videoElement = document.getElementById('local-video');
        
        let localStream = null;
        let peer = null;
        let activeCalls = [];
        let facingMode = 'environment'; // Bakkamera som standard
        let isLowData = false;

        function log(msg, type = 'info') {
            const li = document.createElement('li');
            li.textContent = `[${new Date().toLocaleTimeString('sv-SE')}] ${msg}`;
            if (type === 'error') li.className = 'log-error';
            if (type === 'warn') li.className = 'log-warn';
            debugLog.appendChild(li);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        async function startCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: isLowData ? { max: 480 } : { ideal: 1280 },
                    frameRate: isLowData ? { max: 15 } : { max: 30 }
                },
                audio: true
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = localStream;
                log(`Kamera startad (${isLowData ? 'Låg upplösning' : 'Hög upplösning'}).`);
                
                // Uppdatera pågående samtal om kameran bytts
                activeCalls.forEach(call => {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                });
            } catch (err) {
                log(`Kamerafel: ${err.message}`, 'error');
            }
        }

        function initPeer() {
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                statusBadge.textContent = `Sänder (${roomId})`;
                statusBadge.style.color = '#28a745';
                log(`Redo för anslutningar på rum: ${roomId}`);
            });

            peer.on('call', (call) => {
                log(`Mottagare ansluter...`);
                call.answer(localStream);
                activeCalls.push(call);

                call.on('close', () => {
                    log(`Mottagare kopplade från.`);
                    activeCalls = activeCalls.filter(c => c !== call);
                });
            });

            peer.on('error', (err) => {
                log(`PeerJS Fel: ${err.type}`, 'error');
                if (err.type === 'unavailable-id') {
                    log(`Rummet används redan. Välj en annan kod.`, 'warn');
                }
            });
        }

        document.getElementById('btn-toggle-cam').addEventListener('click', () => {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        document.getElementById('btn-low-data').addEventListener('click', (e) => {
            isLowData = !isLowData;
            e.target.textContent = `Spara Data: ${isLowData ? 'PÅ' : 'AV'}`;
            startCamera();
        });

        startCamera().then(initPeer);
    </script>
</body>
</html>
