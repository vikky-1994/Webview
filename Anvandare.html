<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Sändare – Smart Övervakning & PIN-timeout</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-user: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --purple-color: #9c27b0;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f9fa;
                --card-bg: #ffffff;
                --text-color: #212529;
                --text-secondary: #6c757d;
                --border-color: rgba(0, 0, 0, 0.1);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 14px; }

        header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .back-link { color: var(--accent-user); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        
        .badges-wrapper { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .status-badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            touch-action: none;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        
        .night-vision-active {
            filter: brightness(2.2) contrast(1.8) sepia(100%) hue-rotate(85deg) saturate(350%) !important;
        }

        #zone-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-width { grid-column: span 2; }

        button, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background-color: var(--accent-user); color: #fff; border: none; }
        .btn-success { background-color: var(--success-color); color: #fff; border: none; }
        .btn-danger { background-color: var(--danger-color); color: #fff; border: none; }
        .btn-warning { background-color: var(--warning-color); color: #000; border: none; }
        .btn-purple { background-color: var(--purple-color); color: #fff; border: none; }

        #qr-container {
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: #fff;
            padding: 16px;
            border-radius: var(--border-radius);
            margin-top: 8px;
        }
        #qrcode { margin-top: 8px; }

        .debug-console {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-error { color: #ff4444; }
        .log-warn { color: #ffbb33; }
        .log-motion { color: #00ffff; }
        .log-sound { color: #ff77ff; }
        .log-rec { color: #ff5555; }
        .log-status { color: #77ff77; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Startsida</a>
            <div class="badges-wrapper">
                <span id="pin-display" class="status-badge" style="background: var(--accent-user); color: #fff;">PIN: ----- (05:00)</span>
                <span id="status" class="status-badge">Kopplar upp...</span>
            </div>
        </header>

        <div class="video-container" id="video-wrapper">
            <video id="local-video" autoplay playsinline muted></video>
            <canvas id="zone-canvas"></canvas>
            <audio id="remote-audio" autoplay></audio>
        </div>

        <div class="badges-wrapper">
            <span id="battery-badge" class="status-badge">Batteri: --%</span>
            <span id="net-badge" class="status-badge">Nät: --</span>
            <span id="motion-badge" class="status-badge">Rörelse: AV</span>
            <span id="sound-badge" class="status-badge">Ljudlarm: AV</span>
            <span id="prebuf-badge" class="status-badge">Pre-buffer: AV</span>
        </div>

        <div class="controls-grid">
            <button id="btn-toggle-cam">Växla Kamera</button>
            <button id="btn-toggle-torch">Ficklampa: AV</button>
            
            <button id="btn-toggle-nightvision" class="btn-purple">🌙 Mörkerseende: AV</button>
            <button id="btn-toggle-wakelock">Skärmlås: AV</button>

            <select id="res-select">
                <option value="360">Upplösning: 360p</option>
                <option value="720" selected>Upplösning: 720p (HD)</option>
                <option value="1080">Upplösning: 1080p (Full HD)</option>
            </select>

            <select id="fps-select">
                <option value="1">1 FPS</option>
                <option value="5">5 FPS</option>
                <option value="10">10 FPS</option>
                <option value="15">15 FPS</option>
                <option value="30" selected>30 FPS</option>
            </select>

            <button id="btn-toggle-motion" class="btn-primary">Rörelsedetektor</button>
            <button id="btn-toggle-sound" class="btn-primary">Ljuddetektor</button>

            <button id="btn-toggle-zone" class="btn-purple">📐 Rita Larmzon</button>
            <button id="btn-toggle-prebuffer" class="btn-primary">🔄 Pre-buffer (10s): AV</button>

            <button id="btn-renew-pin" class="btn-warning">🔑 Generera ny PIN</button>
            <button id="btn-snapshot">📸 Ögonblicksbild</button>

            <button id="btn-request-notif">🔔 Tillåt Notiser</button>
            <button id="btn-toggle-qr">QR-Kod för anslutning</button>

            <button id="btn-toggle-record" class="btn-primary full-width">⏺ Starta inspelning</button>
        </div>

        <div id="qr-container">
            <span style="color: #000; font-weight: 600; font-size: 0.9rem;">Skanna för att ansluta som mottagare:</span>
            <div id="qrcode"></div>
        </div>

        <div class="debug-console">
            <ul id="debug-log" style="list-style: none;"></ul>
        </div>
    </div>

    <canvas id="motion-canvas" style="display:none;"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'standard-rum';
        const peerId = `stream-host-${roomId}`;

        const debugLog = document.getElementById('debug-log');
        const statusBadge = document.getElementById('status');
        const pinDisplay = document.getElementById('pin-display');
        const motionBadge = document.getElementById('motion-badge');
        const soundBadge = document.getElementById('sound-badge');
        const batteryBadge = document.getElementById('battery-badge');
        const netBadge = document.getElementById('net-badge');
        const prebufBadge = document.getElementById('prebuf-badge');

        const videoElement = document.getElementById('local-video');
        const videoWrapper = document.getElementById('video-wrapper');
        const zoneCanvas = document.getElementById('zone-canvas');
        const remoteAudio = document.getElementById('remote-audio');
        
        // --- PIN-hantering med timeout ---
        let secretPin = '';
        let pinTimer = null;
        const PIN_TIMEOUT_SECONDS = 300; // 5 minuters livslängd
        let pinTimeLeft = PIN_TIMEOUT_SECONDS;

        let localStream = null;
        let peer = null;
        let activeCalls = [];
        let activeDataConns = [];
        let facingMode = 'environment';
        let targetFps = 30;
        let targetHeight = 720;
        let isMicOn = true;
        let isTorchOn = false;
        let isNightVision = false;

        // Wake Lock
        let wakeLock = null;

        // Detektorer & Zon
        let isMotionDetectionActive = false;
        let motionInterval = null;
        let lastImageData = null;

        let isSoundDetectionActive = false;
        let audioCtx = null;
        let analyser = null;
        let soundInterval = null;

        // Zon (Relativt 0..1)
        let detectionZone = { x: 0, y: 0, w: 1, h: 1 };
        let isDrawingZone = false;
        let drawStart = null;

        // Inspelning & Pre-buffering
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        let isPreBufferActive = false;
        let bufferRecorder = null;
        let ringBuffer = [];
        let isAutoSavingClip = false;

        function log(msg, type = 'info') {
            const li = document.createElement('li');
            li.textContent = `[${new Date().toLocaleTimeString('sv-SE')}] ${msg}`;
            if (type === 'error') li.className = 'log-error';
            if (type === 'warn') li.className = 'log-warn';
            if (type === 'motion') li.className = 'log-motion';
            if (type === 'sound') li.className = 'log-sound';
            if (type === 'rec') li.className = 'log-rec';
            if (type === 'status') li.className = 'log-status';
            debugLog.appendChild(li);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        // --- PIN-rotation & Nedräkning ---
        function generateNewPin() {
            secretPin = Math.floor(10000 + Math.random() * 90000).toString();
            pinTimeLeft = PIN_TIMEOUT_SECONDS;
            updatePinDisplay();
            generateQR();
            log(`Ny PIN genererad: ${secretPin} (gäller i ${PIN_TIMEOUT_SECONDS / 60} min).`, 'status');
        }

        function startPinTimer() {
            if (pinTimer) clearInterval(pinTimer);
            pinTimer = setInterval(() => {
                pinTimeLeft--;
                if (pinTimeLeft <= 0) {
                    generateNewPin();
                } else {
                    updatePinDisplay();
                }
            }, 1000);
        }

        function updatePinDisplay() {
            const mins = Math.floor(pinTimeLeft / 60);
            const secs = pinTimeLeft % 60;
            const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            pinDisplay.textContent = `PIN: ${secretPin} (${timeStr})`;
            
            // Varna när 30s återstår
            if (pinTimeLeft <= 30) {
                pinDisplay.style.backgroundColor = 'var(--danger-color)';
            } else {
                pinDisplay.style.backgroundColor = 'var(--accent-user)';
            }
        }

        document.getElementById('btn-renew-pin').addEventListener('click', generateNewPin);

        // --- Notiser ---
        function sendSystemNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body, icon: 'icon-192.png' });
            }
        }

        document.getElementById('btn-request-notif').addEventListener('click', () => {
            if ("Notification" in window) {
                Notification.requestPermission().then(perm => {
                    log(`Notistillstånd: ${perm}`);
                    if (perm === 'granted') sendSystemNotification('Notiser aktiverade', 'Du kommer få larmnotiser här.');
                });
            } else {
                log('Notiser stöds inte på denna enhet.', 'warn');
            }
        });

        // --- Statusövervakning (Batteri & Nätverk) ---
        function initStatusMonitoring() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    const updateBattery = () => {
                        const level = Math.round(battery.level * 100);
                        const charging = battery.charging ? '⚡' : '';
                        batteryBadge.textContent = `Batteri: ${level}% ${charging}`;
                        
                        if (level < 15 && !battery.charging) {
                            log(`⚠️ Varning: Låg batterinivå (${level}%)`, 'warn');
                            sendSystemNotification('Låg batterinivå!', `Sändarens batteri är på ${level}%.`);
                        }
                        broadcastStatus({ batteryLevel: level, charging: battery.charging });
                    };
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                    battery.addEventListener('chargingchange', updateBattery);
                });
            }

            const updateNetwork = () => {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    const type = conn.effectiveType || 'OK';
                    netBadge.textContent = `Nät: ${type.toUpperCase()}`;
                    broadcastStatus({ networkType: type });
                }
            };
            updateNetwork();
            if (navigator.connection) navigator.connection.addEventListener('change', updateNetwork);
        }

        function broadcastStatus(data) {
            activeDataConns.forEach(conn => {
                if (conn.open) conn.send({ type: 'device-status', ...data });
            });
        }

        // --- Kamera & Strömning ---
        async function startCamera() {
            if (isRecording) stopRecording();

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: facingMode,
                    height: { ideal: targetHeight },
                    frameRate: { ideal: targetFps, max: targetFps }
                },
                audio: true
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localStream.getAudioTracks().forEach(track => track.enabled = isMicOn);

                videoElement.srcObject = localStream;
                log(`Kamera startad (${targetHeight}p @ ${targetFps} FPS).`);
                
                activeCalls.forEach(call => {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const videoSender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (videoSender && videoTrack) videoSender.replaceTrack(videoTrack);

                    const audioTrack = localStream.getAudioTracks()[0];
                    const audioSender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
                    if (audioSender && audioTrack) audioSender.replaceTrack(audioTrack);
                });

                if (isPreBufferActive) restartPreBuffer();
            } catch (err) {
                log(`Kamera/Mikrofon-fel: ${err.message}`, 'error');
            }
        }

        // --- Mörkerseende ---
        document.getElementById('btn-toggle-nightvision').addEventListener('click', () => {
            isNightVision = !isNightVision;
            if (isNightVision) {
                videoElement.classList.add('night-vision-active');
                document.getElementById('btn-toggle-nightvision').textContent = '🌙 Mörkerseende: PÅ';
                log('Digitalt mörkerseende aktiverat.');
            } else {
                videoElement.classList.remove('night-vision-active');
                document.getElementById('btn-toggle-nightvision').textContent = '🌙 Mörkerseende: AV';
                log('Digitalt mörkerseende avstängt.');
            }
        });

        // --- Pre-buffering ---
        function togglePreBuffer() {
            isPreBufferActive = !isPreBufferActive;
            const btn = document.getElementById('btn-toggle-prebuffer');
            if (isPreBufferActive) {
                btn.textContent = '🔄 Pre-buffer: PÅ';
                btn.className = 'btn-success';
                prebufBadge.textContent = 'Pre-buffer: Aktiv';
                prebufBadge.style.backgroundColor = 'var(--success-color)';
                startPreBuffer();
                log('Pre-buffering aktiverad.');
            } else {
                btn.textContent = '🔄 Pre-buffer (10s): AV';
                btn.className = 'btn-primary';
                prebufBadge.textContent = 'Pre-buffer: AV';
                prebufBadge.style.backgroundColor = 'var(--card-bg)';
                stopPreBuffer();
                log('Pre-buffering avstängd.');
            }
        }

        function startPreBuffer() {
            if (!localStream) return;
            ringBuffer = [];
            try {
                bufferRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm;codecs=vp8' });
                bufferRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        ringBuffer.push(e.data);
                        if (ringBuffer.length > 10) ringBuffer.shift();
                    }
                };
                bufferRecorder.start(1000);
            } catch (e) {
                log(`Pre-buffer fel: ${e.message}`, 'error');
            }
        }

        function stopPreBuffer() {
            if (bufferRecorder && bufferRecorder.state !== 'inactive') bufferRecorder.stop();
            ringBuffer = [];
        }

        function restartPreBuffer() {
            stopPreBuffer();
            if (isPreBufferActive) startPreBuffer();
        }

        function triggerAutoClipSave(reason) {
            if (!isPreBufferActive || isAutoSavingClip) return;
            isAutoSavingClip = true;
            log(`🚨 Utlöser automatisk klippinspelning (${reason})...`, 'rec');
            sendSystemNotification('Larm utlöst!', `Automatiskt videoklipp sparas (${reason}).`);

            const savedChunks = [...ringBuffer];
            
            setTimeout(() => {
                const blob = new Blob([...savedChunks, ...ringBuffer.
