<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Sändare – Videoströmming</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-user: #007bff;
            --danger-color: #dc3545;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f9fa;
                --card-bg: #ffffff;
                --text-color: #212529;
                --text-secondary: #6c757d;
                --border-color: rgba(0, 0, 0, 0.1);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .back-link { color: var(--accent-user); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background-color: var(--accent-user); color: #fff; border: none; }
        .btn-success { background-color: #28a745; color: #fff; border: none; }

        .debug-console {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-error { color: #ff4444; }
        .log-warn { color: #ffbb33; }
        .log-motion { color: #00ffff; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Startsida</a>
            <span id="pin-display" class="status-badge" style="background: #007bff; color: #fff;">PIN: -----</span>
            <span id="motion-badge" class="status-badge" style="background: #333; color: #aaa;">Rörelse: AV</span>
            <span id="status" class="status-badge">Kopplar upp...</span>
        </header>

        <div class="video-container">
            <video id="local-video" autoplay playsinline muted></video>
        </div>

        <div class="controls-grid">
            <button id="btn-toggle-cam">Växla Kamera</button>
            <button id="btn-toggle-mic" class="btn-success">Mikrofon: PÅ</button>
            <select id="fps-select">
                <option value="30">30 FPS (Standard)</option>
                <option value="15">15 FPS (Sparar data)</option>
                <option value="60">60 FPS (Hög flyt)</option>
            </select>
            <button id="btn-toggle-motion" class="btn-primary">Rörelsedetektor: AV</button>
        </div>

        <div class="debug-console">
            <ul id="debug-log" style="list-style: none;"></ul>
        </div>
    </div>

    <!-- Dold canvas för rörelsedetektor -->
    <canvas id="motion-canvas" style="display:none;"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'standard-rum';
        const peerId = `stream-host-${roomId}`;

        const debugLog = document.getElementById('debug-log');
        const statusBadge = document.getElementById('status');
        const pinDisplay = document.getElementById('pin-display');
        const motionBadge = document.getElementById('motion-badge');
        const videoElement = document.getElementById('local-video');
        
        const secretPin = Math.floor(10000 + Math.random() * 90000).toString();

        let localStream = null;
        let peer = null;
        let activeCalls = [];
        let facingMode = 'environment';
        let targetFps = 30;
        let isMicOn = true;
        
        // Rörelsedetektor variabler
        let isMotionDetectionActive = false;
        let motionInterval = null;
        let lastImageData = null;

        function log(msg, type = 'info') {
            const li = document.createElement('li');
            li.textContent = `[${new Date().toLocaleTimeString('sv-SE')}] ${msg}`;
            if (type === 'error') li.className = 'log-error';
            if (type === 'warn') li.className = 'log-warn';
            if (type === 'motion') li.className = 'log-motion';
            debugLog.appendChild(li);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        async function startCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 1280 },
                    frameRate: { ideal: targetFps, max: targetFps }
                },
                audio: true
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localStream.getAudioTracks().forEach(track => track.enabled = isMicOn);

                videoElement.srcObject = localStream;
                log(`Kamera startad med ${targetFps} FPS. Ljud: ${isMicOn ? 'PÅ' : 'AV'}`);
                
                activeCalls.forEach(call => {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const videoSender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (videoSender && videoTrack) videoSender.replaceTrack(videoTrack);

                    const audioTrack = localStream.getAudioTracks()[0];
                    const audioSender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
                    if (audioSender && audioTrack) audioSender.replaceTrack(audioTrack);
                });
            } catch (err) {
                log(`Kamera/Mikrofon-fel: ${err.message}`, 'error');
            }
        }

        // --- Rörelsedetektor Logik ---
        function toggleMotionDetection() {
            isMotionDetectionActive = !isMotionDetectionActive;
            const btn = document.getElementById('btn-toggle-motion');

            if (isMotionDetectionActive) {
                btn.textContent = 'Rörelsedetektor: PÅ';
                btn.style.backgroundColor = '#28a745';
                motionBadge.textContent = 'Rörelse: Aktiv';
                motionBadge.style.backgroundColor = '#28a745';
                motionBadge.style.color = '#fff';
                log('Rörelsedetektor aktiverad.', 'motion');

                const canvas = document.getElementById('motion-canvas');
                const ctx = canvas.getContext('2d');

                motionInterval = setInterval(() => {
                    if (!videoElement.videoWidth) return;
                    canvas.width = 100; // Låg upplösning för snabbare jämförelse
                    canvas.height = 75;
                    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                    
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const pixels = imgData.data;

                    if (lastImageData) {
                        let diffCount = 0;
                        for (let i = 0; i < pixels.length; i += 4) {
                            // Jämför röd kanal som en enkel skillnadsmätare
                            const diff = Math.abs(pixels[i] - lastImageData[i]);
                            if (diff > 30) diffCount++; // Tröskelvärde för förändring
                        }

                        // Om mer än 4% av pixlarna har förändrats
                        if (diffCount > (canvas.width * canvas.height * 0.04)) {
                            log('⚠️ Rörelse upptäckt i bildströmmen!', 'motion');
                        }
                    }
                    lastImageData = pixels;
                }, 1000); // Kontrollera en gång i sekunden

            } else {
                btn.textContent = 'Rörelsedetektor: AV';
                btn.style.backgroundColor = '#007bff';
                motionBadge.textContent = 'Rörelse: AV';
                motionBadge.style.backgroundColor = '#333';
                motionBadge.style.color = '#aaa';
                clearInterval(motionInterval);
                lastImageData = null;
                log('Rörelsedetektor avstängd.');
            }
        }

        function initPeer() {
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                statusBadge.textContent = `Sänder (${roomId})`;
                statusBadge.style.color = '#28a745';
                if (pinDisplay) pinDisplay.textContent = `KOD: ${secretPin}`;
                log(`Redo för anslutningar. Genererad PIN: ${secretPin}`);
            });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data && data.type === 'auth') {
                        if (data.pin === secretPin) {
                            log(`Mottagare angav RÄTT kod. Tillåter anslutning.`);
                            conn.send({ type: 'auth-result', success: true });
                        } else {
                            log(`Mottagare angav FEL kod. Nekar tillträde.`, 'warn');
                            conn.send({ type: 'auth-result', success: false });
                        }
                    }
                });
            });

            peer.on('call', (call) => {
                log(`Inkommande anrop...`);
                call.answer(localStream);
                activeCalls.push(call);

                call.on('close', () => {
                    log(`Mottagare kopplade från.`);
                    activeCalls = activeCalls.filter(c => c !== call);
                });
            });

            peer.on('error', (err) => {
                log(`PeerJS Fel: ${err.type}`, 'error');
            });
        }

        // Event Listeners
        document.getElementById('btn-toggle-cam').addEventListener('click', () => {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        document.getElementById('btn-toggle-mic').addEventListener('click', (e) => {
            isMicOn = !isMicOn;
            if (localStream) {
                localStream.getAudioTracks().forEach(track => track.enabled = isMicOn);
            }
            e.target.textContent = `Mikrofon: ${isMicOn ? 'PÅ' : 'AV'}`;
            e.target.style.backgroundColor = isMicOn ? '#28a745' : '#dc3545';
            log(`Mikrofon ${isMicOn ? 'aktiverad' : 'avstängd'}.`);
        });

        document.getElementById('fps-select').addEventListener('change', (e) => {
            targetFps = parseInt(e.target.value);
            log(`Ändrar målett-FPS till ${targetFps}...`);
            startCamera();
        });

        document.getElementById('btn-toggle-motion').addEventListener('click', toggleMotionDetection);

        startCamera().then(initPeer);
    </script>
</body>
</html>
