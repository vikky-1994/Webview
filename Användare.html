<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Sändare – Avancerad Videoströmming</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-user: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f9fa;
                --card-bg: #ffffff;
                --text-color: #212529;
                --text-secondary: #6c757d;
                --border-color: rgba(0, 0, 0, 0.1);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; }

        header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .back-link { color: var(--accent-user); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        
        .badges-wrapper { display: flex; gap: 6px; flex-wrap: wrap; }
        .status-badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-width { grid-column: span 2; }

        button, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:active { opacity: 0.8; }
        .btn-primary { background-color: var(--accent-user); color: #fff; border: none; }
        .btn-success { background-color: var(--success-color); color: #fff; border: none; }
        .btn-danger { background-color: var(--danger-color); color: #fff; border: none; }
        .btn-warning { background-color: var(--warning-color); color: #000; border: none; }

        #qr-container {
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: #fff;
            padding: 16px;
            border-radius: var(--border-radius);
            margin-top: 8px;
        }
        #qrcode { margin-top: 8px; }

        .debug-console {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log-error { color: #ff4444; }
        .log-warn { color: #ffbb33; }
        .log-motion { color: #00ffff; }
        .log-sound { color: #ff77ff; }
        .log-rec { color: #ff5555; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Startsida</a>
            <div class="badges-wrapper">
                <span id="pin-display" class="status-badge" style="background: var(--accent-user); color: #fff;">PIN: -----</span>
                <span id="status" class="status-badge">Kopplar upp...</span>
            </div>
        </header>

        <div class="video-container">
            <video id="local-video" autoplay playsinline muted></video>
            <!-- Ljud från mottagare (Tvåvägsljud) -->
            <audio id="remote-audio" autoplay></audio>
        </div>

        <div class="badges-wrapper" style="justify-content: center;">
            <span id="motion-badge" class="status-badge">Rörelse: AV</span>
            <span id="sound-badge" class="status-badge">Ljudlarm: AV</span>
            <span id="wakelock-badge" class="status-badge">Skärmlås: AV</span>
        </div>

        <div class="controls-grid">
            <button id="btn-toggle-cam">Växla Kamera</button>
            <button id="btn-toggle-torch">Ficklampa: AV</button>
            
            <button id="btn-toggle-mic" class="btn-success">Mikrofon: PÅ</button>
            <button id="btn-toggle-wakelock">Skärmlås: AV</button>

            <select id="res-select">
                <option value="360">Upplösning: 360p (Lågdator/Nät)</option>
                <option value="720" selected>Upplösning: 720p (HD)</option>
                <option value="1080">Upplösning: 1080p (Full HD)</option>
            </select>

            <select id="fps-select">
                <option value="1">1 FPS (Minimal data)</option>
                <option value="5">5 FPS (Extremt låg)</option>
                <option value="10">10 FPS (Sparar batteri)</option>
                <option value="15">15 FPS (Sparar data)</option>
                <option value="30" selected>30 FPS (Standard)</option>
                <option value="60">60 FPS (Hög flyt)</option>
            </select>

            <button id="btn-toggle-motion" class="btn-primary">Rörelsedetektor</button>
            <button id="btn-toggle-sound" class="btn-primary">Ljuddetektor</button>

            <button id="btn-snapshot" class="btn-warning">📸 Ögonblicksbild</button>
            <button id="btn-toggle-qr">QR-Kod för anslutning</button>

            <button id="btn-toggle-record" class="btn-primary full-width">⏺ Starta inspelning</button>
        </div>

        <div id="qr-container">
            <span style="color: #000; font-weight: 600; font-size: 0.9rem;">Skanna för att ansluta som mottagare:</span>
            <div id="qrcode"></div>
        </div>

        <div class="debug-console">
            <ul id="debug-log" style="list-style: none;"></ul>
        </div>
    </div>

    <canvas id="motion-canvas" style="display:none;"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'standard-rum';
        const peerId = `stream-host-${roomId}`;

        const debugLog = document.getElementById('debug-log');
        const statusBadge = document.getElementById('status');
        const pinDisplay = document.getElementById('pin-display');
        const motionBadge = document.getElementById('motion-badge');
        const soundBadge = document.getElementById('sound-badge');
        const wakelockBadge = document.getElementById('wakelock-badge');
        const videoElement = document.getElementById('local-video');
        const remoteAudio = document.getElementById('remote-audio');
        
        const secretPin = Math.floor(10000 + Math.random() * 90000).toString();

        let localStream = null;
        let peer = null;
        let activeCalls = [];
        let facingMode = 'environment';
        let targetFps = 30;
        let targetHeight = 720;
        let isMicOn = true;
        let isTorchOn = false;

        // Wake Lock
        let wakeLock = null;

        // Rörelse- & Ljuddetektor
        let isMotionDetectionActive = false;
        let motionInterval = null;
        let lastImageData = null;

        let isSoundDetectionActive = false;
        let audioCtx = null;
        let analyser = null;
        let soundInterval = null;

        // Inspelning
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        function log(msg, type = 'info') {
            const li = document.createElement('li');
            li.textContent = `[${new Date().toLocaleTimeString('sv-SE')}] ${msg}`;
            if (type === 'error') li.className = 'log-error';
            if (type === 'warn') li.className = 'log-warn';
            if (type === 'motion') li.className = 'log-motion';
            if (type === 'sound') li.className = 'log-sound';
            if (type === 'rec') li.className = 'log-rec';
            debugLog.appendChild(li);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        async function startCamera() {
            if (isRecording) stopRecording();

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: facingMode,
                    height: { ideal: targetHeight },
                    frameRate: { ideal: targetFps, max: targetFps }
                },
                audio: true
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localStream.getAudioTracks().forEach(track => track.enabled = isMicOn);

                videoElement.srcObject = localStream;
                log(`Kamera startad (${targetHeight}p @ ${targetFps} FPS).`);
                
                // Uppdatera sändning till aktiva klienter
                activeCalls.forEach(call => {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const videoSender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (videoSender && videoTrack) videoSender.replaceTrack(videoTrack);

                    const audioTrack = localStream.getAudioTracks()[0];
                    const audioSender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
                    if (audioSender && audioTrack) audioSender.replaceTrack(audioTrack);
                });

                if (isTorchOn) applyTorch(true);
            } catch (err) {
                log(`Kamera/Mikrofon-fel: ${err.message}`, 'error');
            }
        }

        // --- Ficklampa / Blixt ---
        async function applyTorch(state) {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            
            if (capabilities.torch) {
                try {
                    await track.applyConstraints({ advanced: [{ torch: state }] });
                    isTorchOn = state;
                    document.getElementById('btn-toggle-torch').textContent = `Ficklampa: ${state ? 'PÅ' : 'AV'}`;
                    log(`Ficklampa ${state ? 'aktiverad' : 'avstängd'}.`);
                } catch (e) {
                    log(`Ficklampsfel: ${e.message}`, 'error');
                }
            } else {
                log('Ficklampa stöds inte på denna kamera.', 'warn');
            }
        }

        // --- Skärmlås (Wake Lock API) ---
        async function toggleWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    if (!wakeLock) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakelockBadge.textContent = 'Skärmlås: PÅ';
                        wakelockBadge.style.backgroundColor = 'var(--success-color)';
                        document.getElementById('btn-toggle-wakelock').textContent = 'Skärmlås: PÅ';
                        log('Skärmlås aktiverat (skärmen slocknar ej).');
                    } else {
                        await wakeLock.release();
                        wakeLock = null;
                        wakelockBadge.textContent = 'Skärmlås: AV';
                        wakelockBadge.style.backgroundColor = 'var(--card-bg)';
                        document.getElementById('btn-toggle-wakelock').textContent = 'Skärmlås: AV';
                        log('Skärmlås avaktiverat.');
                    }
                } catch (err) {
                    log(`Wake Lock fel: ${err.message}`, 'error');
                }
            } else {
                log('Wake Lock API stöds inte i denna webbläsare.', 'warn');
            }
        }

        // --- Ögonblicksbild (Snapshot) ---
        function takeSnapshot() {
            if (!videoElement.videoWidth) return;
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = `snapshot-${new Date().toISOString().slice(0,19).replace(/[:.]/g,'-')}.png`;
            a.click();
            log('Ögonblicksbild sparades lokalt.');
        }

        // --- Ljuddetektor (Decibel-larm) ---
        function toggleSoundDetection() {
            isSoundDetectionActive = !isSoundDetectionActive;
            const btn = document.getElementById('btn-toggle-sound');

            if (isSoundDetectionActive) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaStreamSource(localStream);
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    source.connect(analyser);

                    const dataArray = new Uint8Array(analyser.frequencyBinCount);
                    soundInterval = setInterval(() => {
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                        let average = sum / dataArray.length;

                        if (average > 50) { // Tröskelvärde för ljudvolym
                            log(`🔊 Högt ljud detekterat! Level: ${Math.round(average)}`, 'sound');
                        }
                    }, 500);

                    btn.textContent = 'Ljuddetektor: PÅ';
                    btn.className = 'btn-success';
                    soundBadge.textContent = 'Ljudlarm: Aktivt';
                    soundBadge.style.backgroundColor = 'var(--success-color)';
                    log('Ljuddetektering aktiverad.', 'sound');
                } catch (e) {
                    log(`Ljuddetektorfel: ${e.message}`, 'error');
                }
            } else {
                clearInterval(soundInterval);
                if (audioCtx) audioCtx.close();
                btn.textContent = 'Ljuddetektor: AV';
                btn.className = 'btn-primary';
                soundBadge.textContent = 'Ljudlarm: AV';
                soundBadge.style.backgroundColor = 'var(--card-bg)';
                log('Ljuddetektering avstängd.');
            }
        }

        // --- Inspelningslogik ---
        function toggleRecording() {
            if (isRecording) stopRecording();
            else startRecording();
        }

        function startRecording() {
            if (!localStream) return;
            recordedChunks = [];
            let options = { mimeType: 'video/webm;codecs=vp9,opus' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

            try {
                mediaRecorder = new MediaRecorder(localStream, options);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveRecording;
                mediaRecorder.start(1000);
                isRecording = true;

                const recBtn = document.getElementById('btn-toggle-record');
                recBtn.textContent = '⏹ Stoppa och spara inspelning';
                recBtn.className = 'btn-danger full-width';
                log('Inspelning startad.', 'rec');
            } catch (err) {
                log(`Inspelningsfel: ${err.message}`, 'error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            isRecording = false;
            const recBtn = document.getElementById('btn-toggle-record');
            recBtn.textContent = '⏺ Starta inspelning';
            recBtn.className = 'btn-primary full-width';
            log('Inspelning avslutad.', 'rec');
        }

        function saveRecording() {
            if (!recordedChunks.length) return;
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inspelning-${new Date().toISOString().slice(0,19).replace(/[:.]/g,'-')}.webm`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 100);
            log('Inspelning sparades lokalt.', 'rec');
        }

        // --- Rörelsedetektor ---
        function toggleMotionDetection() {
            isMotionDetectionActive = !isMotionDetectionActive;
            const btn = document.getElementById('btn-toggle-motion');

            if (isMotionDetectionActive) {
                btn.textContent = 'Rörelsedetektor: PÅ';
                btn.className = 'btn-success';
                motionBadge.textContent = 'Rörelse: Aktiv';
                motionBadge.style.backgroundColor = 'var(--success-color)';
                log('Rörelsedetektor aktiverad.', 'motion');

                const canvas = document.getElementById('motion-canvas');
                const ctx = canvas.getContext('2d');

                motionInterval = setInterval(() => {
                    if (!videoElement.videoWidth) return;
                    canvas.width = 100;
                    canvas.height = 75;
                    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                    
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const pixels = imgData.data;

                    if (lastImageData) {
                        let diffCount = 0;
                        for (let i = 0; i < pixels.length; i += 4) {
                            if (Math.abs(pixels[i] - lastImageData[i]) > 30) diffCount++;
                        }
                        if (diffCount > (canvas.width * canvas.height * 0.04)) {
                            log('⚠️ Rörelse upptäckt!', 'motion');
                        }
                    }
                    lastImageData = pixels;
                }, 1000);
            } else {
                btn.textContent = 'Rörelsedetektor: AV';
                btn.className = 'btn-primary';
                motionBadge.textContent = 'Rörelse: AV';
